name = "flex-mcp"
main = "src/index.ts"
compatibility_date = "2026-11-01"
workers_dev = false
preview_urls = false

[[durable_objects.bindings]]
name = "LEDGER_DO"
class_name = "LedgerDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LedgerDO"]

# No [vars]: every personal value (hostnames, keys, paths) is a required
# secret. This file is safe to publish.
[secrets]
required = [
  "OPENAI_API_KEY",
  "OPENAI_WEBHOOK_SECRET",
  "MCP_HOST",
  "HOOKS_HOST",
]
